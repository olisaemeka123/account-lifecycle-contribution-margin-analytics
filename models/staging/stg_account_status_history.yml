models:
  - name: stg_account_status_history
    description: One row per status or tier change event. Source for SCD Type 2 snapshot modeling.

    columns:
      - name: account_id
        data_type: string
        description: primary key

      - name: status
        data_type: string
        description: historical status of each account.it can be active,churned or dormant


      - name: tier
        data_type: string
        description: historical tier of each account. it can be basic, premium or plus

      - name: effective_date
        data_type: date
        description: historical effective date for each account

  

  

  
  